name: launcher

on:
  push:
    branches: [master]
    paths: ['xntsrv/launcher/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['xntsrv/launcher/**', '.github/workflows/launcher.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: xntsrv/launcher

      - name: Configure
        run: cmake -S xntsrv/launcher -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xntsrv-launcher-x64
          path: |
            build/Release/xntsrv.exe
            build/Release/xntsrvw.exe
