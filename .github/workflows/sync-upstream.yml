name: sync-upstream

# Keeps the `upstream` branch an exact, fast-forward-only mirror of VcXsrv master.
# Merging `upstream` into `master` is a deliberate, manual step.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: upstream
          fetch-depth: 0

      - name: Fast-forward upstream
        run: |
          git fetch https://github.com/marchaesen/vcxsrv.git master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::notice::upstream is already current"
            exit 0
          fi
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:upstream
