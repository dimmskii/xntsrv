name: windows

on:
  push:
    branches: [master]
    paths: ['xntsrv/**', '!xntsrv/bridge/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['xntsrv/**', '!xntsrv/bridge/**', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: xntsrv

      - name: Configure
        run: cmake -S xntsrv -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        # Runners are elevated and thrown away afterwards, so the system test
        # (real service, real registry keys) is safe to run here.
        env:
          XNTSRV_SYSTEM_TESTS: '1'
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xntsrv-windows-x64
          path: build/bin/Release/*.exe
